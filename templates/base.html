<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Bakery Management{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="app-layout">

        <div class="sidebar">
            <h2>Bakery</h2>

            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('ingredients') }}">Ingredients</a>
            <a href="{{ url_for('products') }}">Products & Recipes</a>
            <a href="{{ url_for('capacity') }}">Capacity / Production</a>
            <a href="#">Reports / History</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>

        <main class="content">
            {% block content %}{% endblock %}
        </main>

    </div>

</body>

</html>
